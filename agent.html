<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>Espace Agent — Moov Money Tchad 🇹🇩</title>
  <style>
    :root { color-scheme: light; --orange: #FF6600; --orange-hover: #E65C00; --navy: #001D4A; --purple: #004B93; --yellow: #FFC20E; --ink: #272a32; --muted: #666a73; --line: #d7d7d9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f4f3; color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { padding: 14px max(24px, calc((100vw - 980px) / 2)); background: var(--navy); color: white; border-bottom: 5px solid var(--orange); display: flex; align-items: center; justify-content: space-between; }
    header strong { font: 700 18px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; gap: 8px; }
    main { width: min(100% - 32px, 980px); margin: 42px auto; }
    h1 { color: var(--navy); font: 700 30px/1.15 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); }
    form { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; background: white; border: 1px solid var(--line); padding: 20px; }
    label { grid-column: 1 / -1; font: 700 14px Arial, sans-serif; }
    input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; font: 16px Arial, sans-serif; }
    button { min-height: 46px; border: 0; border-radius: 4px; padding: 0 18px; background: var(--orange); color: white; font: 700 14px Arial, sans-serif; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .language-toggle { min-width: 44px; min-height: 36px; border: 1px solid rgba(255,255,255,.45); border-radius: 4px; background: transparent; color: white; }
    .message { min-height: 22px; margin: 12px 0; font: 14px Arial, sans-serif; }
    [hidden] { display: none !important; }
    .error { color: #a42a20; }
    .table-wrap { overflow-x: auto; background: white; border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; text-align: left; font: 14px Arial, sans-serif; }
    th, td { padding: 12px 14px; border-bottom: 1px solid #e7e7e8; vertical-align: top; }
    th { color: var(--navy); background: #f8f8f7; font-size: 12px; text-transform: uppercase; }
    @media (max-width: 600px) { main { margin-top: 28px; } h1 { font-size: 26px; } form { grid-template-columns: 1fr; } label { grid-column: auto; } }
  </style>
</head>
<body>
  <header><strong style="display:flex;align-items:center;gap:10px;">Moov Money Tchad 🇹🇩 / Espace Agent</strong><button class="language-toggle" type="button">FR</button></header>
  <main>
    <h1>Mes Demandes de Prêt</h1>
    <p id="introText">Connectez-vous avec votre nom d'utilisateur et mot de passe. Seules les demandes autorisées sont affichées.</p>
    <form id="loginForm">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" autocomplete="username" required />
      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button id="loginButton" type="submit">Se connecter</button>
    </form>
    <form id="otpForm" hidden>
      <p id="otpDelivery" aria-live="polite"></p>
      <label for="otpCode">Code envoyé par email</label>
      <input id="otpCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
      <button id="verifyOtpButton" type="submit">Vérifier code</button>
    </form>
    <form id="passwordForm" hidden>
      <label for="currentPassword">Mot de passe temporaire actuel</label>
      <input id="currentPassword" type="password" autocomplete="current-password" required />
      <label for="newPassword">Nouveau mot de passe (minimum 12 caractères)</label>
      <input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required />
      <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
      <input id="confirmPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required />
      <button id="changePasswordButton" type="submit">Changer le mot de passe</button>
    </form>
    <section id="dashboard" hidden>
      <button id="logoutButton" type="button">Se déconnecter</button>
      <p id="leadCount" class="message" role="status"></p>
    </section>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <div class="table-wrap" id="leadTable" hidden>
      <table>
        <thead><tr><th>Date</th><th>Demandeur</th><th>Téléphone</th><th>Prêt</th><th>Montant</th><th>Durée</th><th>Statut</th></tr></thead>
        <tbody id="leadRows"></tbody>
      </table>
    </div>
  </main>
  <script src="/language.js"></script>
  <script>
    window.t = window.t || function(key) { return key; };
    const form = document.getElementById('loginForm');
    const otpForm = document.getElementById('otpForm');
    const passwordForm = document.getElementById('passwordForm');
    const dashboard = document.getElementById('dashboard');
    const leadTable = document.getElementById('leadTable');
    const rows = document.getElementById('leadRows');
    const formatter = new Intl.NumberFormat('fr-FR');
    const message = document.getElementById('message');
    let otpChallengeToken = '';

    function showMessage(text, error = false) {
      message.textContent = window.t(text);
      message.className = error ? 'message error' : 'message';
    }

    async function loadLeads() {
      const response = await fetch('/api/agent/leads');
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Impossible de charger les demandes.');
      rows.replaceChildren();
      for (const lead of data.leads) {
        const row = document.createElement('tr');
        const stage = (lead.status || 'pending').toLowerCase();
        let stageLabel = 'En attente';
        if (stage === 'under_review') stageLabel = 'En Examen';
        else if (stage === 'approved') stageLabel = 'Approuvé';
        else if (stage === 'rejected') stageLabel = 'Rejeté';

        const values = [
          new Date(`${lead.created_at}Z`).toLocaleString('fr-FR'),
          `${lead.first_name} ${lead.last_name}`,
          String(lead.phone).startsWith('+') ? lead.phone : `+235 ${lead.phone}`,
          lead.loan_type,
          `${formatter.format(lead.loan_amount)} FCFA`,
          `${lead.term_months} ${window.t('meses')}`,
          window.t(stageLabel)
        ];
        for (const value of values) {
          const cell = document.createElement('td');
          cell.textContent = value;
          row.append(cell);
        }
        rows.append(row);
      }
      document.getElementById('leadCount').textContent = `${data.leads.length} ${window.t('candidatura(s).')}`;
      leadTable.hidden = false;
      dashboard.hidden = false;
      form.hidden = true;
      passwordForm.hidden = true;
    }

    async function checkExistingSession() {
      try {
        const response = await fetch('/api/agent/me');
        if (!response.ok) return;
        const session = await response.json();
        if (session.mustChangePassword) {
          form.hidden = true;
          passwordForm.hidden = false;
          showMessage('A sessão requer a alteração da senha temporária. Introduza-a para continuar.');
          return;
        }
        await loadLeads();
      } catch (error) {
        showMessage(error.message || 'Não foi possível carregar as candidaturas.', true);
      }
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const loginButton = document.getElementById('loginButton');
      loginButton.disabled = true;
      try {
        const response = await fetch('/api/agent/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Invalid username or password');
        form.hidden = true;
        if (data.otpRequired) {
          otpChallengeToken = data.challengeToken;
          document.getElementById('otpDelivery').textContent = `${window.t('Código enviado para')} ${data.maskedEmail}`;
          otpForm.hidden = false;
          showMessage('Introduza o código de seis dígitos enviado por email.');
        } else if (data.mustChangePassword) {
          passwordForm.hidden = false;
          document.getElementById('currentPassword').value = document.getElementById('password').value;
          showMessage('Altere a senha temporária para continuar.');
        } else {
          await loadLeads();
          showMessage('');
        }
      } catch (error) {
        form.hidden = false;
        showMessage(error.message || 'Connection error.', true);
      } finally {
        loginButton.disabled = false;
      }
    });

    otpForm.addEventListener('submit', async event => {
      event.preventDefault();
      const button = document.getElementById('verifyOtpButton');
      button.disabled = true;
      try {
        const response = await fetch('/api/agent/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            challengeToken: otpChallengeToken,
            code: document.getElementById('otpCode').value.trim()
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Código inválido.');
        otpForm.hidden = true;
        otpChallengeToken = '';
        if (data.mustChangePassword) {
          passwordForm.hidden = false;
          document.getElementById('currentPassword').value = document.getElementById('password').value;
          showMessage('Altere a senha temporária para continuar.');
        } else {
          await loadLeads();
          showMessage('');
        }
      } catch (error) {
        showMessage(error.message || 'Não foi possível verificar o código.', true);
      } finally {
        button.disabled = false;
      }
    });

    passwordForm.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        showMessage('As senhas não coincidem.', true);
        return;
      }
      const button = document.getElementById('changePasswordButton');
      button.disabled = true;
      try {
        const response = await fetch('/api/agent/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not change password');
        document.getElementById('password').value = newPassword;
        document.getElementById('currentPassword').value = newPassword;
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        await loadLeads();
        showMessage('Senha alterada.');
      } catch (error) {
        showMessage(error.message || 'Could not change password', true);
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById('logoutButton').addEventListener('click', async () => {
      await fetch('/api/agent/logout', { method: 'POST' });
      dashboard.hidden = true;
      leadTable.hidden = true;
      form.hidden = false;
      document.getElementById('password').value = '';
      showMessage('Sessão terminada.');
    });

    checkExistingSession();
  </script>
</body>
</html>
